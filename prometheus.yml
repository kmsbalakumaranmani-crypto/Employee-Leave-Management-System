global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'employee-leave-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8080']
        labels:
          group: 'devops-leave-system'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
