# SonarQube Scanner Configuration for Employee Leave Management System
sonar.projectKey=employee-leave-management
sonar.projectName=Employee Leave Management System
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=src
sonar.tests=tests

# Inclusions and Exclusions
sonar.exclusions=node_modules/**,coverage/**,data/**,src/public/**
sonar.test.inclusions=tests/**/*.test.js

# Test execution and coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
