version: '3.8'

services:
  # 1. Employee Leave Management Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-leave-app
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_TYPE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=leave_user
      - MYSQL_PASSWORD=leave_pass123
      - MYSQL_DATABASE=leave_management_db
      - JWT_SECRET=super-secret-devops-jwt-token-2026
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - devops-network

  # 2. MySQL Database
  mysql:
    image: mysql:8.0
    container_name: employee-leave-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: leave_management_db
      MYSQL_USER: leave_user
      MYSQL_PASSWORD: leave_pass123
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "leave_user", "-pleave_pass123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - devops-network

  # 3. Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: devops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
    networks:
      - devops-network

  # 4. Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: devops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
